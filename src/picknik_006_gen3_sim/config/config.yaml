###############################################################
#
#  MoveIt Pro robot configuration: bare-arm Kinova Gen3 7DoF in MuJoCo.
#  Inherits from picknik_006_gen3_mock; overrides urdf_params to drop the
#  Robotiq and wrist RealSense so the URDF matches the existing bare-arm
#  MuJoCo scene (description/mujoco/scene.xml). picknik_006_gen3_hw inherits
#  from this package and re-enables the gripper + wrist RealSense for the
#  real robot.
#
###############################################################

based_on_package: "picknik_006_gen3_mock"

hardware:
  # Use the MuJoCo simulator backend.
  simulated: True

  # Bring up MuJoCo as the "robot driver" while running in simulation mode.
  simulated_robot_driver_persist_launch_file:
    package: "picknik_006_gen3_sim"
    path: "launch/sim/robot_drivers_to_persist_sim.launch.py"

  robot_description:
    urdf_params:
      - mujoco_keyframe: "default"
      - mujoco_model: "description/mujoco/scene.xml"
      - mujoco_viewer: false
      - use_fake_hardware: "%>> hardware.simulated"
      # MuJoCo scene is the bare arm. Drop the gripper + wrist RealSense that
      # picknik_006_gen3_mock declares so the URDF matches the scene.
      - gripper: ""
      - wrist_realsense: "false"

ros2_control:
  # _sim simulates a force-torque sensor via MuJoCo, so override _mock's
  # ros2_control manifest with one that declares the FTS broadcaster, JTAC,
  # and VFC alongside the standard controllers.
  config:
    package: "picknik_006_gen3_sim"
    path: "config/control/picknik_kinova_gen3.ros2_control.yaml"
  # MuJoCo has no gripper to drive; trim the inherited active-controllers list
  # and bring up the FTS broadcaster so JTAC / VFC can be activated later.
  controllers_active_at_startup:
    - "joint_state_broadcaster"
    - "force_torque_sensor_broadcaster"
  controllers_inactive_at_startup:
    - "joint_trajectory_controller"
    - "joint_trajectory_admittance_controller"
    - "velocity_force_controller"
    - "joint_velocity_controller"
