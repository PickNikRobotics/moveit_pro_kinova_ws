controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    twist_controller:
      type: picknik_twist_controller/PicknikTwistController

    # The gripper controller just relays position commands
    robotiq_gripper_controller:
      type: position_controllers/GripperActionController

    fault_controller:
      type: picknik_reset_fault_controller/PicknikResetFaultController

    # JTAC and VFC run without a force-torque sensor in _mock — their param
    # blocks below omit ft_sensor_name and point sensor_frame at grasp_link.
    # _sim and _hw override this manifest with one that adds an FTS broadcaster
    # and configures JTAC / VFC to consume it.
    joint_trajectory_admittance_controller:
      type: joint_trajectory_admittance_controller/JointTrajectoryAdmittanceController

    velocity_force_controller:
      type: velocity_force_controller/VelocityForceController

    joint_velocity_controller:
      type: joint_velocity_controller/JointVelocityController


joint_trajectory_controller:
  ros__parameters:
    gains:
      joint_1:
        angle_wraparound: true
      joint_3:
        angle_wraparound: true
      joint_5:
        angle_wraparound: true
      joint_7:
        angle_wraparound: true
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
      - joint_7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.0
      goal_time: 10.0
      joint_1:
        goal: 0.05
      joint_2:
        goal: 0.05
      joint_3:
        goal: 0.05
      joint_4:
        goal: 0.05
      joint_5:
        goal: 0.05
      joint_6:
        goal: 0.05
      joint_7:
        goal: 0.05

twist_controller:
  ros__parameters:
    joint: tcp
    interface_names:
      - twist.linear.x
      - twist.linear.y
      - twist.linear.z
      - twist.angular.x
      - twist.angular.y
      - twist.angular.z

robotiq_gripper_controller:
  ros__parameters:
    default: true
    joint: robotiq_85_left_knuckle_joint
    allow_stalling: true
    stall_timeout: 0.05
    goal_tolerance: 0.02

# JTAC without an FTS: ft_sensor_name omitted; sensor_frame falls back to a
# link that exists in the kinematic chain (grasp_link is the same link used
# as ee_frame). _sim / _hw override this with ft_sensor_name set.
joint_trajectory_admittance_controller:
  ros__parameters:
    planning_group_name: manipulator
    sensor_frame: grasp_link
    ee_frame: grasp_link
    default_path_tolerance: 0.5
    stop_accelerations: [3.0, 3.0, 3.0, 3.0, 5.0, 5.0, 5.0]

# VFC without an FTS — same convention as JTAC above.
velocity_force_controller:
  ros__parameters:
    planning_group_name: manipulator
    sensor_frame: grasp_link
    ee_frame: grasp_link
    ft_force_deadband: 2.0
    ft_torque_deadband: 1.0
    max_joint_velocity:
      - 0.524
      - 0.524
      - 0.524
      - 0.524
      - 1.407
      - 1.407
      - 1.407
    max_joint_acceleration:
      - 52.4
      - 52.4
      - 52.4
      - 52.4
      - 52.4
      - 52.4
      - 52.4
    max_cartesian_velocity:
      - 0.25
      - 0.25
      - 0.25
      - 1.5707
      - 1.5707
      - 1.5707
    max_cartesian_acceleration:
      - 20.0
      - 20.0
      - 20.0
      - 40.0
      - 40.0
      - 40.0

joint_velocity_controller:
  ros__parameters:
    planning_group_name: manipulator
    max_joint_velocity:
      - 0.7
      - 0.7
      - 0.7
      - 0.7
      - 0.6
      - 0.6
      - 0.6
    max_joint_acceleration:
      - 2.6
      - 2.6
      - 2.6
      - 2.6
      - 5.0
      - 5.0
      - 5.0
    command_interfaces: ["position"]
    # Padding (in radians) added to joint position limits as a safety margin.
    joint_limit_position_tolerance: 0.02
    # Stop motion if no new command in this many seconds.
    command_timeout: 0.2
    # Hz at which the controller publishes state.
    state_publish_rate: 20
