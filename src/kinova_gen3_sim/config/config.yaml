###############################################################
#
#  MoveIt Pro robot configuration: Kinova Gen3 7DoF in MuJoCo simulation.
#  Inherits from kinova_gen3_mock and overrides only the simulation-specific
#  fields (MuJoCo scene, simulated_robot_driver_persist_launch_file).
#
###############################################################

based_on_package: "kinova_gen3_mock"

hardware:

  robot_description:
    urdf_params:
      - mujoco_keyframe: "default"
      - mujoco_model: "description/mujoco/scene.xml"
      - mujoco_model_package: "kinova_gen3_sim"
      - mujoco_viewer: false
      - use_fake_hardware: "false"

ros2_control:
  config:
    package: "kinova_gen3_sim"
    path: "config/control/picknik_kinova_gen3.ros2_control.yaml"
  controllers_active_at_startup:
    - "joint_state_broadcaster"
    - "robotiq_gripper_controller"
  controllers_inactive_at_startup:
    - "joint_trajectory_controller"
    - "joint_trajectory_admittance_controller"
    - "velocity_force_controller"
    - "joint_velocity_controller"

objectives:
  objective_library_paths:
    mujoco_objectives:
      package_name: "moveit_pro_objectives"
      relative_path: "objectives/mujoco"
    sim_objectives:
      package_name: "kinova_gen3_sim"
      relative_path: "objectives"
