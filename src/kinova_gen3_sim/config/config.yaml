###############################################################
#
#  MoveIt Pro robot configuration: Kinova Gen3 7DoF in MuJoCo simulation.
#
#  NOT FUNCTIONAL - this configuration cannot start. It fails
#  during URDF generation, before MuJoCo would ever be reached:
#
#    error: Xacro conditional "${use_fake_hardware}" evaluated to
#    "%>> hardware.simulated", which is not a boolean expression.
#
#  The `%>>` cross-reference syntax on use_fake_hardware below was removed in
#  MoveIt Pro 6.0.0 and nothing in moveit_studio_utils_py implements it any more,
#  so the literal string reaches kortex.ros2_control.xacro's xacro:if. This at
#  least fails loudly rather than silently mis-launching.
#
#  Even with that fixed the config would not run MuJoCo: the mujoco_* urdf_params
#  below are declared as xacro args in
#  kinova_gen3_mock/description/picknik_kinova_gen3.xacro but never consumed, and
#  nothing emits a <ros2_control> block with the picknik_mujoco_ros/MujocoSystem
#  plugin. Wiring that up requires suppressing the <ros2_control> block that
#  ros2_kortex's load_arm macro emits unconditionally (the pinned main-picknik SHA
#  has no include_ros2_control arg) and emitting a MuJoCo one instead — see
#  src/test_config_packages/core_integration_config in the moveit_pro repo for the
#  reference pattern.
#
#  Until then, use kinova_gen3_mock for development and kinova_gen3_hw for the
#  real arm.
#
#  This package is also still a partly-renamed copy of the old space-satellite
#  demo config: description/mujoco/ carries landsat and rafti scenes and
#  assets, and objectives/ carries AprilTag registration, compliant-grasp, and
#  force-torque objectives that the bare-arm boilerplate does not use. That
#  content belongs on a demo branch rather than on main.
#
###############################################################

based_on_package: "kinova_gen3_mock"

hardware:
  simulated: True

  robot_description:
    urdf_params:
      - mujoco_keyframe: "default"
      - mujoco_model: "description/mujoco/scene.xml"
      - mujoco_viewer: false
      - use_fake_hardware: "%>> hardware.simulated"
