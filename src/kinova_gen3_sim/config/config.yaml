###############################################################
#
#  MoveIt Pro robot configuration: Kinova Gen3 7DoF in MuJoCo simulation.
#
#  Inherits from kinova_gen3_mock and swaps the arm's ros2_control hardware for
#  picknik_mujoco_ros/MujocoSystem, simulating description/mujoco/scene.xml.
#
###############################################################

based_on_package: "kinova_gen3_mock"

runtime_launch_file:
  package: "kinova_gen3_sim"
  path: "launch/runtime.launch.xml"

hardware:
  robot_description:
    urdf_params:
      - hardware_interface: "mujoco"
      - mujoco_model: "description/mujoco/scene.xml"
      # Simulated instead when the gripper urdf_param selects robotiq_2f_85.
      - mujoco_model_robotiq_2f_85: "description/mujoco/scene_robotiq_2f_85.xml"
      - mujoco_model_package: "kinova_gen3_sim"
      - mujoco_keyframe: "default"
      - mujoco_viewer: "false"
