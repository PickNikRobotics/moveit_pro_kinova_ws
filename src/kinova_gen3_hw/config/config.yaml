###############################################################
#
#  MoveIt Pro robot configuration: Kinova Gen3 7DoF on real hardware.
#  Inherits from kinova_gen3_sim (which inherits from kinova_gen3_mock) and
#  overrides only the fields that change for real hardware: drop the simulator
#  and target the Kortex driver. Adjust robot_ip below for your robot.
#
###############################################################

based_on_package: "kinova_gen3_sim"

hardware:
  simulated: False

  robot_description:
    urdf_params:
      - robot_ip: "192.168.11.11"
      - username: "admin"
      - password: "admin"
      - port: "10000"
      - port_realtime: "10001"
      - session_inactivity_timeout_ms: "60000"
      - connection_inactivity_timeout_ms: "2000"
      - tf_prefix: ""
      - use_internal_bus_gripper_comm: "true"
      - gripper: "robotiq_2f_85"
      - gripper_joint_name: "robotiq_85_left_knuckle_joint"
      - gripper_max_velocity: "100.0"
      - gripper_max_force: "100.0"
      - use_fake_hardware: "false"
      - fake_sensor_commands: "false"

ros2_control:
  config:
    package: "kinova_gen3_hw"
    path: "config/control/picknik_kinova_gen3.ros2_control.yaml"
  controllers_active_at_startup:
    - "joint_state_broadcaster"
    # Workaround: the Kortex driver only transmits internal-bus gripper commands
    # through its joint-controller cyclic refresh path.
    - "joint_velocity_controller"
    - "robotiq_gripper_controller"
  controllers_inactive_at_startup:
    - "joint_trajectory_admittance_controller"
    - "joint_trajectory_controller"
    - "velocity_force_controller"

objectives:
  objective_library_paths:
    hw_objectives:
      package_name: "kinova_gen3_hw"
      relative_path: "objectives"