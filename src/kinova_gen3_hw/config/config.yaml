###############################################################
#
#  MoveIt Pro robot configuration: Kinova Gen3 7DoF on real hardware.
#  Inherits from kinova_gen3_sim (which inherits from kinova_gen3_mock) and
#  overrides only the fields that change for real hardware: drop the simulator
#  and target the Kortex driver. Adjust robot_ip below for your robot.
#
###############################################################

based_on_package: "kinova_gen3_sim"

hardware:
  simulated: False

  robot_driver_persist_launch_file:
    package: "kinova_gen3_hw"
    path: "launch/robot_drivers_to_persist.launch.py"

  robot_description:
    urdf_params:
      - robot_ip: "192.168.1.10"
      - use_fake_hardware: "false"
      - fake_sensor_commands: "false"

moveit_params:
  joint_limits:
    package: "kinova_gen3_hw"
    path: "config/moveit/joint_limits.yaml"
  pose_jog:
    package: "kinova_gen3_hw"
    path: "config/moveit/pose_jog.yaml"
  joint_jog:
    package: "kinova_gen3_hw"
    path: "config/moveit/joint_jog.yaml"
